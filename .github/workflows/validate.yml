name: Validate AI Atlas
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate content and runtime JS
        run: node scripts/validate-content.mjs
      - name: Verify deterministic standalone HTML build
        run: |
          python3 scripts/build.py
          git diff --exit-code -- dist/index.html
